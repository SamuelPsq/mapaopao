# 马跑跑 · Nginx 站点配置（生产部署）
# 安装：sudo cp deploy/nginx.conf /etc/nginx/sites-available/mapaopao
#       sudo ln -s /etc/nginx/sites-available/mapaopao /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# HTTPS：certbot --nginx -d your.domain（把 listen 80 交给 certbot 改造即可）

server {
    listen 80;
    server_name your.domain;   # ← 换成你的域名或服务器 IP

    # 前端静态产物（app/dist），SPA 路由回退到 index.html
    root /var/www/mapaopao/app/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代：前端 api.ts 用相对路径（BASE=""），同源部署零改动
    # 必须覆盖 /v1（业务接口）、/jobs（定时任务触发口）与 /docs（FastAPI 文档，可对内保留）
    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;    # 智能识别成绩上传照片
    }
    location /jobs/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # 定时任务触发口只允许本机/内网访问时，加 allow/deny 白名单
    }
    location /docs {
        proxy_pass http://127.0.0.1:8000;
    }

    # 安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
}
